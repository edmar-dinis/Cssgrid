<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trabalho de Programacao web</title>
<style>

    
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background-color: #f2f2f2;
    }

    /* ===== Layout principal usando CSS GRID ===== */
    .container {
        display: grid;
        grid-template-columns: 200px 1fr;   /* coluna da navegação + coluna do conteúdo */
        grid-template-rows: auto 1fr auto;  /* cabeçalho / conteúdo / rodapé */
        grid-template-areas:
            "header header"
            "nav    main"
            "footer footer";
        min-height: 100vh;
    }

    
    header {
        grid-area: header;
        background-color: #c2185b; /* rosa/vermelho, como na imagem */
        color: white;
        padding: 20px;
        text-align: center;
    }

    
    nav {
        grid-area: nav;
        background-color: #8bc34a; /* verde, como na imagem */
        padding: 15px;
    }

    nav ul {
        list-style: none;
    }

    nav ul li {
        margin-bottom: 10px;
    }

    nav ul li a {
        color: white;
        text-decoration: none;
        font-weight: bold;
    }

    nav ul li a:hover {
        text-decoration: underline;
    }

    /* ===== Conteúdo ===== */
    main {
        grid-area: main;
        background-color: #e0f7fa; /* azul claro, como na imagem */
        padding: 20px;
    }

    /* ===== Rodapé ===== */
    footer {
        grid-area: footer;
        background-color: #3f51b5; /* azul escuro, como na imagem */
        color: white;
        text-align: center;
        padding: 15px;
    }

    /* ===== Formulário de cadastro ===== */
    .form-cadastro {
        background-color: white;
        max-width: 500px;
        margin: 0 auto;
        padding: 20px;
        border-radius: 8px;
    }

    .form-cadastro h2 {
        margin-bottom: 15px;
        text-align: center;
        color: #333;
    }

    .campo {
        margin-bottom: 12px;
        display: flex;
        flex-direction: column;
    }

    .campo label {
        margin-bottom: 4px;
        font-weight: bold;
        color: #333;
    }

    .campo input,
    .campo select {
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
    }

    .btn-enviar {
        width: 100%;
        padding: 10px;
        background-color: #3f51b5;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
    }

    .btn-enviar:hover {
        background-color: #303f9f;
    }

    /* =========================================
       VERSÃO MOBILE (RESPONSIVE)
       Quando o ecrã for pequeno, a navegação
       desaparece de lado e fica tudo em coluna,
       igual ao desenho "Versão Mobile"
    ========================================== */
    @media (max-width: 700px) {
        .container {
            grid-template-columns: 1fr;
            grid-template-areas:
                "header"
                "nav"
                "main"
                "footer";
        }
    }

</style>
</head>
<body>

    <div class="container">

        <!-- CABEÇALHO -->
        <header>
            <h1>Trabalho de Programacao Web</h1>
        </header>

        <!-- NAVEGAÇÃO -->
        <nav>
            <ul>
                <li><a href="#">Início</a></li>
                <li><a href="#">Sobre</a></li>
                <li><a href="#">Cadastro</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>

        <!-- CONTEÚDO -->
        <main>

            <!-- Formulário de cadastro de usuário pedido no exercício -->
            <div class="form-cadastro">
                <h2>Cadastro de Usuário</h2>
                <form>

                    <div class="campo">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite o seu nome">
                    </div>

                    <div class="campo">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="exemplo@email.com">
                    </div>

                    <div class="campo">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Digite a sua palavra-passe">
                    </div>

                    <div class="campo">
                        <label for="sexo">Sexo</label>
                        <select id="sexo" name="sexo">
                            <option value="">Selecione</option>
                            <option value="feminino">Feminino</option>
                            <option value="masculino">Masculino</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="endereco">Endereço</label>
                        <input type="text" id="endereco" name="endereco" placeholder="Digite o seu endereço">
                    </div>

                    <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" name="telefone" placeholder="Digite o seu telefone">
                    </div>

                    <div class="campo">
                        <label for="nacionalidade">Nacionalidade</label>
                        <input type="text" id="nacionalidade" name="nacionalidade" placeholder="Digite a sua nacionalidade">
                    </div>

                    <div class="campo">
                        <label for="nivel">Nível Académico</label>
                        <select id="nivel" name="nivel">
                            <option value="">Selecione</option>
                            <option value="ensino-basico">Ensino Básico</option>
                            <option value="ensino-medio">Ensino Médio</option>
                            <option value="licenciatura">Licenciatura</option>
                            <option value="mestrado">Mestrado</option>
                            <option value="doutoramento">Doutoramento</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="profissao">Profissão</label>
                        <input type="text" id="profissao" name="profissao" placeholder="Digite a sua profissão">
                    </div>

                    <button type="submit" class="btn-enviar">Cadastrar</button>

                </form>
            </div>

        </main>

        <!-- RODAPÉ -->
        <footer>
            <p>&copy; 2026 Trabalho de Consolidação - Todos os direitos reservados</p>
        </footer>

    </div>

</body>
</html>
